name: LegendKids protected-media checks
on:
  pull_request:
    paths:
      - "backend/**"
      - "bot/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENROUTER_API_KEY: ""
      TOGETHER_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt "pytest==8.3.4"
      - name: Syntax compile
        run: python -m compileall -q backend bot tests
      - name: Unit and service regression tests
        run: python -m pytest -q tests/test_private_media_access.py tests/test_payment_idempotency_regression.py
