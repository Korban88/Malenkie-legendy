name: LegendKids protected-media checks
on:
  pull_request:
    paths:
      - "backend/**"
      - "bot/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: legendkids_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: legendkids_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legendkids_test -d legendkids_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEGENDKIDS_TEST_POSTGRES_DSN: "postgresql+psycopg://legendkids_test:synthetic_ci_only@127.0.0.1:5432/legendkids_test"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENROUTER_API_KEY: ""
      TOGETHER_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install isolated test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt -r bot/requirements.txt "pytest==8.3.4"
      - name: Syntax compile
        run: python -m compileall -q backend bot tests
      - name: Unit and service regression tests
        run: python -m pytest -q tests/test_private_media_access.py tests/test_asgi_privacy_integration.py tests/test_payment_idempotency_regression.py tests/test_book_release.py tests/test_bot_order_smoke.py
      - name: Generate and verify synthetic illustrated book through real PDF renderer
        run: python tests/e2e_pdf_smoke.py --out "${{ runner.temp }}/legendkids-synthetic"
      - name: Attach synthetic proof (no customer data)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legendkids-synthetic-book
          path: ${{ runner.temp }}/legendkids-synthetic/
          retention-days: 3
          if-no-files-found: error
